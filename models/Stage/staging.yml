version: 2

models:
  - name: stg_nation
    columns:
      - name: nationkey
        tests:
          - unique
          # - not_null
      - name: regionkey
        tests:
          - relationships:
              field: regionkey
              to: ref('stg_region')
  - name: stg_region
    columns: 
      - name: name
        tests:
          - accepted_values:
              values:
                - "AFRICA"
                - "AMERICA"
                - "ASIA"
                - "EUROPE"
                - "MIDDLE EAST"
                